# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    paths-ignore:
      - 'forge/**'
  pull_request:
    paths-ignore:
      - 'forge/**'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Configure Gradle Java toolchain
      run: |
        echo "org.gradle.java.installations.auto-detect=false" >> gradle.properties
        echo "org.gradle.java.installations.paths=$JAVA_HOME" >> gradle.properties

    - name: Build with Gradle
      run: ./gradlew :fabric:build -Pmod_version="$(git describe --always --tags --first-parent | cut -c2-)"

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: dist/
        
    - name: Archive mapping.txt
      uses: actions/upload-artifact@v4
      with:
        name: Mappings
        path: mapping/
