
name: Tests

on:
  push:
    paths-ignore:
      - 'forge/**'
  pull_request:
    paths-ignore:
      - 'forge/**'

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Java installation
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        java -version
        test -x "$JAVA_HOME/bin/java"
      
    - name: Executing tests
      env:
        JAVA_HOME: ${{ env.JAVA_HOME }}
        JAVA_OPTS: "--enable-native-access=ALL-UNNAMED"
        ORG_GRADLE_JAVA_INSTALLATIONS_AUTO_DETECT: "false"
        ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: ${{ env.JAVA_HOME }}
        ORG_GRADLE_JAVA_INSTALLATIONS_FROM_ENV: JAVA_HOME
      run: ./gradlew test

