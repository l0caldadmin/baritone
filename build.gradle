allprojects {
    apply plugin: 'java'
    apply plugin: "maven-publish"

    base.archivesName = rootProject.archives_base_name

    def vers = ""
    try {
        vers = 'git describe --always --tags --first-parent --dirty'.execute().text.trim()
    } catch (Exception e) {
        println "Version detection failed: " + e
    }
    if (!vers.startsWith("v")) {
        println "using version number: " + rootProject.mod_version
        version = rootProject.mod_version
    } else {
        version = vers.substring(1)
        println "Detected version " + version
    }
    group = rootProject.maven_group

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
        }
    }

    repositories {
        maven {
            name = 'spongepowered-repo'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'fabric-maven'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        maven {
            name = 'babbaj-repo'
            url = 'https://babbaj.github.io/maven/'
        }
    }

    dependencies {
        compileOnly "org.spongepowered:mixin:${project.mixin_version}"
        compileOnly "org.ow2.asm:asm:${project.asm_version}"
        compileOnly files("${rootProject.rootDir}/libs/minecraft-26.1.jar")

        // MC 26.1 transitive deps (provided at runtime by MC)
        compileOnly "com.google.guava:guava:33.5.0-jre"
        compileOnly "com.google.code.gson:gson:2.13.2"
        compileOnly "it.unimi.dsi:fastutil:8.5.18"
        compileOnly "org.joml:joml:1.10.8"
        compileOnly "org.slf4j:slf4j-api:2.0.17"
        compileOnly "org.apache.logging.log4j:log4j-api:2.25.2"
        compileOnly "org.apache.commons:commons-lang3:3.19.0"
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
        compileOnly "com.mojang:brigadier:1.3.10"
        compileOnly "com.mojang:datafixerupper:9.0.19"
        compileOnly "io.netty:netty-buffer:4.2.7.Final"
        compileOnly "io.netty:netty-common:4.2.7.Final"
        compileOnly "io.netty:netty-transport:4.2.7.Final"
        compileOnly "io.netty:netty-codec-http:4.2.7.Final"
        compileOnly "commons-io:commons-io:2.20.0"

        implementation "dev.babbaj:nether-pathfinder:${project.nether_pathfinder_version}"
        testImplementation "com.mojang:authlib:6.0.54"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = project.java_version.toInteger()
    }
}

base.archivesName = base.archivesName.get() + "-common"

sourceSets {
    api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += api.output
        runtimeClasspath += api.output
    }
    test {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    launch {
        compileClasspath += main.compileClasspath + main.runtimeClasspath + main.output
        runtimeClasspath += main.compileClasspath + main.runtimeClasspath + main.output
    }
    schematica_api {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
    main {
        compileClasspath += schematica_api.output
        runtimeClasspath += schematica_api.output
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

jar {
    from sourceSets.main.output, sourceSets.launch.output, sourceSets.api.output
}

javadoc {
    options.addStringOption('Xwerror', '-quiet') // makes the build fail on travis when there is a javadoc error
    options.linkSource true
    options.encoding "UTF-8" // allow emoji in comments :^)
    source = sourceSets.api.allJava
    classpath += sourceSets.api.compileClasspath
}

